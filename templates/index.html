<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory Demand Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-tab="remaining">

<!-- icon sprite (used with <use href="#i-name">) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="m7.5 4.27 9 5.15"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M13 17V9"/><path d="M18 17V5"/><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M8 17v-3"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></symbol>
    <symbol id="i-calc" viewBox="0 0 24 24"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01M12 10h.01M8 10h.01M12 14h.01M8 14h.01M12 18h.01M8 18h.01"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></symbol>
  </defs>
</svg>

<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true"><i></i><i></i><i></i></span>
    <div>
      <h1>Inventory Demand Planner</h1>
      <p>Check remaining stock, predict demand and decide how many units to order</p>
    </div>
  </div>
  <p class="model"><span>Model: <strong>Random Forest Regressor</strong>, 100 trees</span></p>
</header>

<main>
  <div class="tabs" role="tablist" aria-label="Planner tools">
    <button type="button" role="tab" id="tab-remaining" data-tab="remaining" aria-selected="true" aria-controls="panel"><svg class="ico"><use href="#i-box"/></svg><span>Remaining inventory</span></button>
    <button type="button" role="tab" id="tab-demand" data-tab="demand" aria-selected="false" aria-controls="panel" tabindex="-1"><svg class="ico"><use href="#i-chart"/></svg><span>Demand prediction</span></button>
    <button type="button" role="tab" id="tab-order" data-tab="order" aria-selected="false" aria-controls="panel" tabindex="-1"><svg class="ico"><use href="#i-cart"/></svg><span>Order quantity</span></button>
  </div>

  <div class="workspace" id="panel" role="tabpanel" aria-labelledby="tab-remaining">
    <form class="panel" id="form" novalidate>
      <div class="form-head">
        <span class="head-icon"><svg class="ico"><use id="formIcon" href="#i-box"/></svg></span>
        <div>
          <h2 id="formTitle"></h2>
          <p class="hint" id="formHint"></p>
        </div>
      </div>

      <label class="f-inv"><span class="lbl"><b>Inventory level</b> (units in stock)</span>
        <span class="field"><span class="fi"><svg class="ico"><use href="#i-box"/></svg></span>
          <input id="inv" type="number" min="0" step="1" inputmode="numeric" placeholder="For example 120"></span>
      </label>
      <label class="f-sold"><span class="lbl"><b>Units sold</b></span>
        <span class="field"><span class="fi"><svg class="ico"><use href="#i-cart"/></svg></span>
          <input id="sold" type="number" min="0" step="1" inputmode="numeric" placeholder="For example 45"></span>
      </label>
      <label class="f-rem"><span class="lbl"><b>Remaining inventory</b> (calculated)</span>
        <span class="field calc"><span class="fi"><svg class="ico"><use href="#i-calc"/></svg></span>
          <input id="rem" type="text" readonly placeholder="Inventory level minus units sold"></span>
      </label>
      <label class="only-predict"><span class="lbl"><b>Category</b></span>
        <span class="field"><span class="fi"><svg class="ico"><use href="#i-grid"/></svg></span>
          <select id="category">
            <option value="">Select category</option>
            {% for c in categories %}<option value="{{ c }}">{{ c }}</option>
            {% endfor %}
          </select></span>
      </label>
      <label class="only-predict"><span class="lbl"><b>Region</b></span>
        <span class="field"><span class="fi"><svg class="ico"><use href="#i-pin"/></svg></span>
          <select id="region">
            <option value="">Select region</option>
            {% for r in regions %}<option value="{{ r }}">{{ r }}</option>
            {% endfor %}
          </select></span>
      </label>
      <label class="only-predict"><span class="lbl"><b>Seasonality</b></span>
        <span class="field"><span class="fi"><svg class="ico"><use href="#i-sun"/></svg></span>
          <select id="season">
            <option value="">Select season</option>
            {% for s in seasons %}<option value="{{ s }}"{% if s == default_season %} selected{% endif %}>{{ s }}</option>
            {% endfor %}
          </select></span>
      </label>
      <label class="only-order"><span class="lbl"><b>Days to cover</b></span>
        <span class="field"><span class="fi"><svg class="ico"><use href="#i-cal"/></svg></span>
          <input id="days" type="number" min="1" max="90" step="1" value="7"></span>
      </label>
      <label class="only-order"><span class="lbl"><b>Safety stock</b> (%)</span>
        <span class="field"><span class="fi"><svg class="ico"><use href="#i-shield"/></svg></span>
          <input id="safety" type="number" min="0" max="100" step="1" value="20"></span>
      </label>

      <p class="error" id="error" role="alert"></p>
      <button class="go" id="go" type="submit"></button>

      <!-- illustration (shown on the Remaining inventory tab) -->
      <svg class="illus" viewBox="0 0 240 230" aria-hidden="true">
        <defs>
          <g id="bx">
            <rect width="36" height="30" rx="2" fill="#f3b45e"/>
            <path d="M0 0 L5 -7 H41 L36 0Z" fill="#fbd68f"/>
            <path d="M36 0 L41 -7 V23 L36 30Z" fill="#d9923a"/>
            <rect x="14" width="8" height="30" fill="#fde9b8" opacity=".9"/>
          </g>
        </defs>
        <circle cx="112" cy="130" r="92" fill="#dce8ff"/>
        <circle cx="112" cy="130" r="70" fill="#e9f1ff"/>
        <g class="leaves" fill="#c4d6ff">
          <path d="M150 74 C140 44 160 24 170 10 C184 30 178 58 150 74Z"/>
          <path d="M150 78 C130 62 128 44 132 30 C150 42 158 60 150 78Z" fill="#b3c9ff"/>
          <path d="M162 70 C176 56 192 54 206 56 C200 72 182 80 162 70Z"/>
        </g>
        <rect x="22" y="192" width="150" height="9" rx="2" fill="#1e3a8a"/>
        <rect x="30" y="201" width="20" height="9" fill="#172b6b"/>
        <rect x="88" y="201" width="20" height="9" fill="#172b6b"/>
        <rect x="144" y="201" width="20" height="9" fill="#172b6b"/>
        <g class="boxes">
          <use href="#bx" x="28" y="162"/><use href="#bx" x="69" y="162"/><use href="#bx" x="110" y="162"/>
          <use href="#bx" x="48" y="132"/><use href="#bx" x="89" y="132"/>
          <use href="#bx" x="68" y="102"/>
        </g>
        <g class="clip" transform="translate(140 112)">
          <rect width="66" height="84" rx="9" fill="#2f5fe3"/>
          <rect x="6" y="10" width="54" height="68" rx="5" fill="#fff"/>
          <rect x="21" y="-5" width="24" height="12" rx="4" fill="#1e3a8a"/>
          <g fill="none" stroke="#22b573" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 24l3.5 3.5L22 20"/><path d="M12 38l3.5 3.5L22 34"/>
          </g>
          <g fill="#c9d6f2"><rect x="28" y="22" width="26" height="4" rx="2"/><rect x="28" y="36" width="22" height="4" rx="2"/></g>
          <polyline points="12,68 24,60 33,64 50,46" fill="none" stroke="#2f5fe3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M44 45h7v7" fill="none" stroke="#2f5fe3" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </svg>
    </form>

    <section class="panel result" id="result" aria-live="polite"></section>
  </div>

  <section class="panel history">
    <div class="history-head">
      <h2><span class="head-icon sm"><svg class="ico"><use href="#i-clock"/></svg></span>Recent calculations</h2>
      <button type="button" class="ghost" id="clearLog"><svg class="ico"><use href="#i-trash"/></svg>Clear history</button>
    </div>
    <div class="scroll">
      <table>
        <thead><tr><th>Time</th><th>Tool</th><th>Inventory / Sold</th><th>Result</th><th></th></tr></thead>
        <tbody id="log"></tbody>
      </table>
    </div>
  </section>
</main>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
